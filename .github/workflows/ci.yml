# SPDX-License-Identifier: Apache-2.0
# Both ROS packages declare Apache-2.0 (THIRD_PARTY_NOTICES.md §1); the
# <license> guard below keeps it that way.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-scan:
    name: XML / license / binary / IP scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils libimage-exiftool-perl

      - name: package.xml well-formedness
        run: |
          set -e
          xmllint --noout tron2_gazebo/package.xml
          xmllint --noout limxsdk-sim/package.xml

      - name: Gazebo plugin descriptor well-formedness
        run: |
          set -e
          xmllint --noout tron2_gazebo/tron2_hw_sim_plugins.xml

      - name: package.xml <license> guard (fail on TODO / Proprietary)
        run: |
          set -e
          bad=0
          for pkg in tron2_gazebo/package.xml limxsdk-sim/package.xml; do
            val=$(sed -n 's:.*<license>\(.*\)</license>.*:\1:p' "$pkg" | head -n1)
            echo "── $pkg  <license>$val</license>"
            case "$val" in
              TODO|Proprietary|proprietary|todo|""|"UNKNOWN"|"unknown")
                echo "::error file=$pkg::<license> is '$val'; owner sign-off required — see THIRD_PARTY_NOTICES.md §1"
                bad=$((bad+1))
                ;;
            esac
          done
          if [ $bad -ne 0 ]; then exit 1; fi

      - name: Committed-binary deny-list (outside limxsdk-sim/lib/)
        run: |
          set -e
          # The four bundled SDK binaries under limxsdk-sim/lib/ are
          # intentionally kept but must still be cleared for provenance;
          # see THIRD_PARTY_NOTICES.md §2. Anywhere else in the tree,
          # binary artifacts are forbidden.
          bad=$(git ls-files | \
            grep -iE '\.(onnx|pt|pth|ckpt|so|dll|dylib|lib|whl|bag|mcap)$' | \
            grep -v '^limxsdk-sim/lib/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Committed binaries outside limxsdk-sim/lib/:"
            echo "$bad"
            exit 1
          fi

      - name: Bundled SDK binary manifest (informational)
        run: |
          set -e
          echo "── bundled SDK binaries (⚠ TO CONFIRM in THIRD_PARTY_NOTICES.md §2)"
          find limxsdk-sim/lib -type f \( -name '*.so' -o -name '*.dll' -o -name '*.lib' \) -print0 | \
            xargs -0 sha256sum

      - name: EXIF sanity on doc/ media
        run: |
          set -e
          bad=0
          shopt -s nullglob
          for img in doc/*.jpg doc/*.jpeg doc/*.png doc/*.gif doc/*.GIF; do
            [ -f "$img" ] || continue
            hits=$(exiftool "$img" | grep -iE '(gps|serial|author|artist|owner)' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$img::EXIF discloses $hits"
              bad=$((bad+1))
            fi
          done
          if [ $bad -ne 0 ]; then exit 1; fi

      - name: "Private-IP scan (allowlist: apibase.h placeholder)"
        run: |
          set -e
          # RFC-1918 ranges + link-local 169.254/16. 127.0.0.1 is fine
          # (localhost). <robot-ip> is the documented placeholder inside
          # limxsdk-sim/include/limxsdk/apibase.h — allowlisted.
          hits=$(grep -RInE \
            '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|169\.254\.[0-9]+\.[0-9]+)\b' \
            tron2_gazebo limxsdk-sim 2>/dev/null | \
            grep -v '^limxsdk-sim/include/limxsdk/apibase.h:' | \
            grep -v '127\.0\.0\.1' || true)
          if [ -n "$hits" ]; then
            echo "::error::Private-IP literal(s) found outside the documented placeholder:"
            echo "$hits"
            echo "See SECURITY.md — the only allowed private-IP literal is <robot-ip> in limxsdk-sim/include/limxsdk/apibase.h."
            exit 1
          fi

      - name: Doc marker scan (no unresolved TODO / proprietary in top-level docs)
        run: |
          set -e
          # Note: the ⚠ TO CONFIRM markers are intentional in this
          # scaffolding; this check only fails on unqualified strings
          # like "TODO: license" or "confidential".
          # The grep command documented in CONTRIBUTING.md contains the
          # search terms itself, so lines quoting it are ignored.
          hits=$(grep -RniE '(todo: license|unknown license|confidential)' \
                   README.md THIRD_PARTY_NOTICES.md CHANGELOG.md \
                   CONTRIBUTING.md SECURITY.md NOTICE | \
                 grep -vE "grep -R[a-zA-Z]* '" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Unresolved license / confidentiality markers in top-level docs"
            exit 1
          fi

  build:
    name: catkin_make + Gazebo smoke test (Noetic, Gazebo 11)
    runs-on: ubuntu-latest
    container:
      image: ros:noetic-ros-base-focal
      options: --cap-add=NET_ADMIN
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and simulation dependencies
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git iproute2 xvfb python3-pygame \
            ros-noetic-xacro \
            ros-noetic-gazebo-ros-pkgs \
            ros-noetic-gazebo-ros-control \
            ros-noetic-gazebo-plugins \
            ros-noetic-ros-control \
            ros-noetic-ros-controllers \
            ros-noetic-controller-manager \
            ros-noetic-joint-state-controller \
            ros-noetic-hardware-interface \
            ros-noetic-realtime-tools \
            ros-noetic-robot-state-publisher \
            ros-noetic-urdf \
            libeigen3-dev liburdfdom-tools

      - uses: actions/checkout@v4
        with:
          path: src/tron2_gazebo_ros

      - name: Fetch sibling packages (as in the README workspace setup)
        run: |
          set -e
          cd src
          git clone --depth 1 https://github.com/limxdynamics/tron2_rl_deploy_ros.git
          git clone --depth 1 https://github.com/limxdynamics/limxsdk-lowlevel.git
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/limxdynamics/tron2-robot-description.git
          for r in tron2_rl_deploy_ros limxsdk-lowlevel tron2-robot-description; do
            echo "::notice::$r @ $(git -C $r rev-parse --short HEAD)"
          done

      - name: catkin_make
        run: |
          set -e
          source /opt/ros/noetic/setup.bash
          set +e
          catkin_make > /tmp/catkin.log 2>&1
          rc=$?
          set -e
          tail -n 80 /tmp/catkin.log
          if [ $rc -ne 0 ]; then
            # Surface the first errors as annotations so they show without the raw log.
            grep -nE "error|Error|CMake Error|Could not find|not found" /tmp/catkin.log | head -n 10 | \
              while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit $rc
          fi

      - name: URDF expands for SF_TRON2A and WF_TRON2A
        run: |
          set -e
          source devel/setup.bash
          for r in SF_TRON2A WF_TRON2A; do
            xacro "$(rospack find robot_description)/tron2a/$r/xacro/robot.urdf.xacro" ros_version:=1 > /tmp/$r.urdf
            check_urdf /tmp/$r.urdf > /tmp/$r.check
            head -n 3 /tmp/$r.check
            grep -q 'tron2_gazebo/Tron2HWSim' /tmp/$r.urdf
            echo "::notice::$r URDF expands and loads tron2_gazebo/Tron2HWSim"
          done

      - name: Gazebo smoke test (headless, informational)
        continue-on-error: true
        run: |
          set +e +o pipefail
          ip link set lo multicast on
          ip route add 239.0.0.0/8 dev lo || true
          source devel/setup.bash
          pose() {
            timeout 10 rostopic echo -n1 /gazebo/model_states 2>/dev/null | python3 -c "
          import sys, yaml
          try:
              m = yaml.safe_load(sys.stdin.read().split('---')[0]); i = m['name'].index('tron2_robot'); p = m['pose'][i]['position']
              print('%.2f,%.2f,%.2f' % (p['x'], p['y'], p['z']))
          except Exception as e:
              print('n/a')"
          }
          for r in SF_TRON2A WF_TRON2A; do
            log=/tmp/sim_$r.log
            xvfb-run -a -s "-screen 0 1280x720x24" roslaunch tron2_hw tron2_hw_sim.launch robot_type:=$r use_joystick:=false > $log 2>&1 &
            pid=$!
            trace=""
            for t in 8 10 12; do sleep 2; [ $t = 8 ] && sleep 6; trace="$trace t$t=$(pose)"
              js=$(timeout 5 rostopic echo -n1 /joint_states/position 2>/dev/null | head -n1 | cut -c1-120)
              echo "::notice::$r t$t joint_states.position: $js"
            done
            ctl=$(timeout 10 rosservice call /tron2_hw/controller_manager/list_controllers 2>/dev/null | grep -E "name:|state:" | tr -s ' ' | tr '\n' ' ' | cut -c1-300)
            echo "::notice::$r controllers: $ctl"
            for t in 15 20 25 30 35; do sleep 5; trace="$trace t$t=$(pose)"; done
            rostopic pub -1 /tron2_controller/set_mode std_msgs/String "data: 'WALK'" > /dev/null 2>&1 || true
            (timeout 20 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist "{linear: {x: 0.3}}" > /dev/null 2>&1 &)
            for t in 40 45 50 55; do sleep 5; trace="$trace walk$t=$(pose)"; done
            echo "::notice::$r base x,y,z: $trace"
            rtf=$(timeout 5 gz stats -p -d 2 2>/dev/null | tail -n 1)
            echo "::notice::$r gz stats (rtf, sim time, real time, paused): $rtf"
            grep -iE "error|fail|Tron2HWSim|Switching|controller_spawner|Loaded|Started controllers" $log | grep -v "^\s*$" | head -n 8 | \
              while IFS= read -r l; do echo "::warning::$r | ${l:0:300}"; done
            kill -INT $pid 2>/dev/null; sleep 8
            pkill -9 -f gzserver; pkill -9 -f gzclient; pkill -9 -f tron2_hw_node; sleep 2
          done
